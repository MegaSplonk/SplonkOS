name: Build AVR (changed project)

on:
  pull_request:

jobs:
  build-changes:
    runs-on: ubuntu-latest

    env:
      SPLONKCHAIN_URL: https://github.com/Maix0/SplonkChain/releases/download/v0.1.0/splonkchain.tar.gz
      SPLONKCHAIN_ARCHIVE: /opt/splonkchain/splonkchain-v0.1.0.tar.gz
      SPLONKCHAIN_DIR: /opt/avr
      SPLONKCHAIN_COMPRESS: -z

    steps:
      - name: Download Toolchain
        shell: bash
        run: |
          sudo mkdir -p "$(dirname "$SPLONKCHAIN_ARCHIVE")"
          sudo curl -sL "$SPLONKCHAIN_URL" -o "$SPLONKCHAIN_ARCHIVE"

      - name: Unpack Toolchain
        shell: bash
        run: |
          sudo mkdir -p "$SPLONKCHAIN_DIR"
          sudo tar --strip-components=1 "$SPLONKCHAIN_COMPRESS" -xf "$SPLONKCHAIN_ARCHIVE" -C "$SPLONKCHAIN_DIR"
          echo "$SPLONKCHAIN_DIR/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }} || true

      - name: Compute merge base
        run: |
          if MERGE_BASE=$(git merge-base origin/${{ github.event.pull_request.base.ref }} HEAD); then
            echo "MERGE_BASE=$MERGE_BASE" >> $GITHUB_ENV
          fi

      - id: detect
        name: Select project to rebuild
        shell: bash
        run: |
          exec sh scripts/detect-changes.sh
      - name: Build changed projects
        if: steps.detect.outputs.projects != ''
        shell: bash
        run: |
          make -k PROJECTS="${{ steps.detect.outputs.projects }}" WERROR=-Werror
