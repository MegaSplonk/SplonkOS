name: Build AVR (changed project)

on:
  pull_request:

jobs:
  build-changes:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Toolchain
        shell: bash
        run: |
          curl -sL https://github.com/Maix0/SplonkChain/releases/download/v0.1.0/splonkchain.tar.gz | sudo tar xzf /dev/stdin -C /usr/ --strip-components=1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }} || true
      - name: Compute merge base
        run: |
          if MERGE_BASE=$(git merge-base origin/${{ github.event.pull_request.base.ref }} HEAD); then
            echo "MERGE_BASE=$MERGE_BASE" >> $GITHUB_ENV
          fi

      - id: detect
        name: Select project to rebuild
        shell: bash
        run: |
          exec sh scripts/detect-changes.sh
      - name: Build changed projects
        if: steps.detect.outputs.projects != ''
        shell: bash
        run: |
          make -k PROJECTS="${{ steps.detect.outputs.projects }}" WERROR=-Werror
