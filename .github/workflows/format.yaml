name: Check Format

on:
  pull_request:

jobs:
  check-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-toolchain

      
      - name: Check Formatting
        shell: bash
        run: |
          make check-format
