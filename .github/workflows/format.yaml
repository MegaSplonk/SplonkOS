name: Check Format

on:
  pull_request:

jobs:
  check-format:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Toolchain
        shell: bash
        run: |
          curl -sL https://github.com/Maix0/SplonkChain/releases/download/v0.1.0/splonkchain.tar.gz | sudo tar xzf /dev/stdin -C /usr/ --strip-components=1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Check Formatting
        shell: bash
        run: |
          make check-format
